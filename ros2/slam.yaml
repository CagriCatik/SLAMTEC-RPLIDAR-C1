slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    resolution: 0.05
    min_laser_range: 0.05
    max_laser_range: 12.0
    scan_queue_size: 1
    transform_publish_period: 0.05
    map_update_interval: 3.0
