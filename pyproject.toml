[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slamtec-rplidar-c1-lab"
version = "0.1.0"
description = "Reproducible 2D perception and mapping for SLAMTEC RPLIDAR C1M1-R2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
viewer = ["matplotlib>=3.8,<4"]

[project.scripts]
c1-lab = "c1_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
